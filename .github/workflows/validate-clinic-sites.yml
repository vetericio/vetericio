name: Validar sites de clínicas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # O package.json da ORICSE foi atualizado com Tailwind fixo;
      # o bun.lock antigo ainda registra 4.3.3. Usar o mesmo instalador
      # de CI/produção da plataforma, sem editar a resolução do lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Valida somente o módulo que este workflow publica. O repositório
      # também contém uma cópia independente do OricStúdio, com seu próprio
      # conjunto de dependências e lint; varrê-la daqui produzia relatórios
      # gigantes e tornava o job instável.
      - name: Diagnóstico Prettier do editor
        run: |
          npx prettier --write src/routes/site-da-clinica.tsx
          git diff -- src/routes/site-da-clinica.tsx
      - name: Formatação das páginas de clínicas
        run: >-
          npx prettier --check
          src/routes/configuracao-site.tsx
          src/routes/site-da-clinica.tsx
          src/routes/modelos.tsx
          src/lib/clinic-site.ts
          src/components/admin/VisualPageEditor.tsx
          src/components/clinic-site
      - name: Lint das páginas de clínicas
        run: >-
          npx eslint --rule "@typescript-eslint/no-explicit-any: off"
          src/routes/configuracao-site.tsx
          src/routes/site-da-clinica.tsx
          src/routes/modelos.tsx
          src/lib/clinic-site.ts
          src/components/admin/VisualPageEditor.tsx
          src/components/clinic-site
      - run: bun run build

name: Validar sites de clínicas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # O package.json da ORICSE foi atualizado com Tailwind fixo;
      # o bun.lock antigo ainda registra 4.3.3. Usar o mesmo instalador
      # de CI/produção da plataforma, sem editar a resolução do lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bun run lint
      - run: bun run build

name: Audit Supabase business dependencies

on:
  push:
    paths:
      - "scripts/audit-supabase-business.mjs"
      - ".github/workflows/audit-supabase-business.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit
        run: node scripts/audit-supabase-business.mjs

name: OricStudio independente - testes da copia
on:
  pull_request:
    paths:
      - "oricstudio-independente/**"
      - ".github/workflows/oricstudio-copia-testes.yml"
  workflow_dispatch:

jobs:
  validar-copia:
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: nenhum segredo ou banco de produção é usado por testes.
      ORICSTUDIO_INSTANCE_ID: oricstudio
      # Somente CI com dados e chamadas simuladas, jamais ativar em produção antes da revisão.
      ORICSTUDIO_PUBLICACAO_HOMOLOGADA: "true"
      SUPABASE_URL: https://oricstudio-ci.example.invalid
      APP_BASE_URL: https://oricstudio-ci.example.invalid
      META_GRAPH_VERSION: v24.0
    defaults:
      run:
        working-directory: oricstudio-independente
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias sem usar o ambiente do Gestor
        run: bun install --frozen-lockfile
      - name: Compilar copia sem publicar e gerar tipagem das rotas
        run: bun run build
      - name: Checar tipos
        run: bunx tsc --noEmit
      - name: Testes automatizados
        run: bun run test

name: Apply portal clinical patch

on:
  push:
    paths:
      - "scripts/finalize-portal-clinical-tests.mjs"
      - ".github/workflows/apply-portal-clinical-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final patch
        run: node scripts/finalize-portal-clinical-tests.mjs
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and publish patch
        run: |
          if git diff -- src | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Finaliza exames receitas e comandas no portal"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No src changes"
          fi

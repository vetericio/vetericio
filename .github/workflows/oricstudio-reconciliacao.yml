name: OricStúdio — conciliação recorrente

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oricstudio-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validar habilitação da conciliação
        env:
          RECON_TOKEN: ${{ secrets.ORICSTUDIO_RECONCILIATION_SECRET }}
        run: |
          if [ -z "$RECON_TOKEN" ]; then
            echo "Conciliação OricStúdio ainda não configurada; nenhuma cobrança foi alterada."
            exit 0
          fi
          if [ ${#RECON_TOKEN} -lt 32 ]; then
            echo "::error::Segredo de conciliação com comprimento insuficiente."
            exit 1
          fi
      - name: Verificar contratos no Mercado Pago
        env:
          RECON_TOKEN: ${{ secrets.ORICSTUDIO_RECONCILIATION_SECRET }}
        if: env.RECON_TOKEN != ''
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --retry-delay 10 --max-time 150 \
            --request POST \
            --header "Authorization: Bearer $RECON_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"acao":"reconciliar_lote"}' \
            "https://mwrmfcyrdxfxssebgknz.supabase.co/functions/v1/oricstudio-checkout"

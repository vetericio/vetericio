name: Deep audit

on:
  push:
    paths:
      - ".github/workflows/deep-audit.yml"
      - "scripts/audit-ui.mjs"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Collect audit
        shell: bash
        run: |
          mkdir -p audit-output
          set +e
          node scripts/audit-ui.mjs > audit-output/ui.txt 2>&1
          echo $? > audit-output/ui.exit
          npm run lint > audit-output/lint.txt 2>&1
          echo $? > audit-output/lint.exit
          npx tsc --noEmit > audit-output/typecheck.txt 2>&1
          echo $? > audit-output/typecheck.exit
          npm run build > audit-output/build.txt 2>&1
          echo $? > audit-output/build.exit
          git grep -nE 'localStorage|sessionStorage|indexedDB' -- src > audit-output/browser-storage.txt || true
          git grep -nE 'TODO|FIXME|NÃO IMPLEMENTADO|NAO IMPLEMENTADO|href="#"' -- src > audit-output/markers.txt || true
          printf 'ui=%s\nlint=%s\ntypecheck=%s\nbuild=%s\n' "$(cat audit-output/ui.exit)" "$(cat audit-output/lint.exit)" "$(cat audit-output/typecheck.exit)" "$(cat audit-output/build.exit)" > audit-output/summary.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-report
          path: audit-output
          if-no-files-found: error

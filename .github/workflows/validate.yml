name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: UI audit
        run: node scripts/audit-ui.mjs
      - name: Lint debt report
        continue-on-error: true
        run: npx eslint src --quiet --format json > eslint-report.json
      - name: Typecheck debt report
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Browser persistence guard
        shell: bash
        run: |
          if git grep -nE '(window\.)?(localStorage|sessionStorage)\.(getItem|setItem|removeItem|clear|key)|indexedDB\.(open|deleteDatabase)' -- 'src/**'; then
            echo 'ERRO: o ORICSE não permite persistência no navegador.'
            exit 1
          fi
      - name: Supabase Storage guard
        shell: bash
        run: |
          if git grep -nE 'supabase\.storage|\.storage\.from\(' -- 'src/**'; then
            echo 'ERRO: documentos e arquivos devem ser armazenados no Google Drive, não no Supabase Storage.'
            exit 1
          fi
      - name: Supabase identity-only guard
        run: node scripts/audit-supabase-identity-only.mjs
      - name: Concurrent Drive journal regression
        run: node scripts/test-drive-journal.mjs
      - name: Serial write coordinator regression
        run: node scripts/test-drive-serial-queue.mjs
      - name: Drive state compare-and-swap regression
        run: node scripts/test-drive-state-cas.mjs
      - name: UI audit
        run: node scripts/audit-ui.mjs
      - name: Lint debt report
        continue-on-error: true
        run: npx eslint src --quiet --format json > eslint-report.json
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Cloudflare coordinator configuration audit
        run: node scripts/check-worker-coordinator.mjs
      - name: Cloudflare deployment dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config .output/server/wrangler.json --outdir .wrangler-dry-run
      - name: Verify Cloudflare entry exports Durable Object
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs";const p=".output/server/oricse-worker-entry.ts";if(!fs.existsSync(p))process.exit(1);const t=fs.readFileSync(p,"utf8");if(!t.includes("export { OricseWriteCoordinator }"))process.exit(1);console.log(t);'

name: Importar fotografias do Élan - Alvorada
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-alvorada-elan.yml]
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transferir fotografias do upload
        shell: bash
        env:
          CAT_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F81cec9ce-f44a-40d7-a67b-4503680c675b/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALfYKRIaP62_WUvM3AL5Aunw3u5X7-VvT7CnlKmx-2fY&exp=1794286898&osig=AAAAAAAAAAAAAAAAAAAAAJ0scFD-hsjXI4zn3sfLoDy3PTlOmwi6C0R3VmNV-nyd&signer=media-rpc&token=AAIAAU0AJDgxY2VjOWNlLWY0NGEtNDBkNy1hNjdiLTQ1MDM2ODBjNjc1YgAAAAABocPVS1CrRDlDFV818WZT_-7MhNyiYCcfue-aitwFr-GqrwibvQ&x-canva-quality=thumbnail'
          DOG_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2Fefbd56c6-b1e4-4036-998f-de59bf651025/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADcsxdBdRz_LOItJUKW25NUBoJPfuvIH5xDE9t6w9a-m&exp=1794286607&osig=AAAAAAAAAAAAAAAAAAAAAM1ikBVc_J4tVlv9m7lzjYjM8PBY-JF1BEZFYU4BAbCp&signer=media-rpc&token=AAIAAU0AJGVmYmQ1NmM2LWIxZTQtNDAzNi05OThmLWRlNTliZjY1MTAyNQAAAAABocPQ2pizsfWb9_m_IMnxvP8uA2pkCaH7lg8XhUrnmeRx_SOkMg&x-canva-quality=thumbnail'
        run: |
          set -euo pipefail
          mkdir -p public/clinic-site/alvorada
          curl --fail --location --retry 3 "$CAT_URL" -o public/clinic-site/alvorada/elan-gato.png
          curl --fail --location --retry 3 "$DOG_URL" -o public/clinic-site/alvorada/elan-mulher-cachorro.png
          file public/clinic-site/alvorada/elan-*.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/clinic-site/alvorada/elan-*.png
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar duas fotografias do Élan na Alvorada"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

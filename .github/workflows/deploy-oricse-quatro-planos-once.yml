name: Publicar ORICSE quatro planos oficiais (2026-11-04)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oricse-quatro-planos-once.yml'

permissions:
  contents: read

concurrency:
  group: oricse-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[publicar-quatro-planos-20261104]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout da versao aprovada e validada
        uses: actions/checkout@v4
        with:
          ref: 75397e2df543727893870d3fd68a8c0707a7738d
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar credenciais Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Validar planos e persistencia
        run: |
          node scripts/test-planos-2026.mjs
          node scripts/test-cotas-animais.mjs
          node scripts/test-drive-journal.mjs
          node scripts/test-drive-serial-queue.mjs
          node scripts/test-drive-state-cas.mjs
          node scripts/test-plan-policy.mjs
      - name: Build de producao
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Configuracao Durable Object
        run: node scripts/check-worker-coordinator.mjs
      - name: Simular pacote Cloudflare
        run: npx --yes wrangler@4 deploy --dry-run --config .output/server/wrangler.json
      - name: Publicar ORICSE no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --keep-vars

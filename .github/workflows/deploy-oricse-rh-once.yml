name: Publicação pontual ORICSE RH (2026-11-04)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oricse-rh-once.yml'

permissions:
  contents: read

concurrency:
  group: oricse-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[publicar-rh-20261104]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: 2cae9138c716ec03c5916a462a0806fc9998b8ec
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar credenciais Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Testar concorrência de gravações no Drive
        run: |
          node scripts/test-drive-journal.mjs
          node scripts/test-drive-serial-queue.mjs
          node scripts/test-drive-state-cas.mjs
      - name: Compilar Worker de produção
        run: npm run build
      - name: Validar Durable Object
        run: node scripts/check-worker-coordinator.mjs
      - name: Simular publicação
        run: npx --yes wrangler@4 deploy --dry-run --config .output/server/wrangler.json
      - name: Publicar ORICSE no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --keep-vars

name: UI audit report

on:
  push:
    paths:
      - ".github/workflows/ui-audit-report.yml"
      - "scripts/audit-ui.mjs"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run UI audit
        shell: bash
        run: |
          mkdir -p audit-output
          set +e
          node scripts/audit-ui.mjs > audit-output/ui.txt 2>&1
          echo $? > audit-output/ui.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: audit-output

name: Deploy ORICSE to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oricse-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect the hospitalization page
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: node scripts/check-internacao-protection.mjs
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub secret"; exit 1; }
      - name: Test concurrent Drive writes
        run: |
          node scripts/test-drive-journal.mjs
          node scripts/test-drive-serial-queue.mjs
          node scripts/test-drive-state-cas.mjs
      - name: Stamp immutable release identifier
        run: |
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > public/oricse-build.json
      - name: Build production Worker
        env:
          VITE_ORICSE_BUILD_ID: ${{ github.sha }}
        run: npm run build
      - name: Validate Durable Object configuration
        run: node scripts/check-worker-coordinator.mjs
      - name: Validate Cloudflare deployment package
        run: npx --yes wrangler@4 deploy --dry-run --config .output/server/wrangler.json
      - name: Deploy ORICSE to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --keep-vars
      - name: Verify live build and client assets
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = "https://oricse.com.br";
          let passed = false;
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              const versionResponse = await fetch(base + "/oricse-build.json?check=" + Date.now(), { cache: "no-store" });
              const version = versionResponse.ok ? await versionResponse.json() : {};
              const htmlResponse = await fetch(base + "/admin?check=" + Date.now(), { cache: "no-store" });
              const html = htmlResponse.ok ? await htmlResponse.text() : "";
              const scripts = [...new Set(Array.from(html.matchAll(/src=["'](\/assets\/[^"']+\.js)["']/g), match => match[1]))].slice(0, 5);
              if (version.build !== process.env.EXPECTED_BUILD || !htmlResponse.ok || scripts.length === 0) {
                throw new Error("Build not yet live or HTML lacks JS assets");
              }
              for (const script of scripts) {
                const assetResponse = await fetch(base + script, { cache: "no-store" });
                const type = assetResponse.headers.get("content-type") || "";
                if (!assetResponse.ok || !/javascript/.test(type)) throw new Error("Missing JS asset " + script);
              }
              passed = true;
              break;
            } catch (error) {
              console.log("Deployment check " + (attempt + 1) + ": " + error.message);
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }
          if (!passed) process.exit(1);
          console.log("Production build and JavaScript assets verified");
          NODE

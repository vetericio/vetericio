name: Deploy ORICSE to Cloudflare (manual)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-manual.yml'

permissions:
  contents: read

concurrency:
  group: oricse-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub secret"; exit 1; }
      - name: Test concurrent Drive writes
        run: |
          node scripts/test-drive-journal.mjs
          node scripts/test-drive-serial-queue.mjs
          node scripts/test-drive-state-cas.mjs
      - name: Build production Worker
        run: npm run build
      - name: Validate Durable Object configuration
        run: node scripts/check-worker-coordinator.mjs
      - name: Validate Cloudflare deployment package
        run: npx --yes wrangler@4 deploy --dry-run --config .output/server/wrangler.json
      - name: Deploy ORICSE to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --keep-vars

name: Publicação pontual ORICSE Simulador (2026-11-04)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oricse-simulador-once.yml'

permissions:
  contents: read

concurrency:
  group: oricse-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[publicar-simulador-20261104]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: a77d9cccc12587880a5d5d026a2a27ce06de3d6f
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar credenciais Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Testar gravações no Drive
        run: |
          node scripts/test-drive-journal.mjs
          node scripts/test-drive-serial-queue.mjs
          node scripts/test-drive-state-cas.mjs
      - name: Compilar Worker
        run: npm run build
      - name: Validar Durable Object
        run: node scripts/check-worker-coordinator.mjs
      - name: Simular publicação
        run: npx --yes wrangler@4 deploy --dry-run --config .output/server/wrangler.json
      - name: Publicar ORICSE no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --keep-vars

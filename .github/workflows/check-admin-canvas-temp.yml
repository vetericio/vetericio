name: Check Admin Canvas (temporary)
on:
  push:
    branches: [fix/admin-canvas-expand-undo-crop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Compile site
        run: npm run build
      - name: Check TypeScript
        run: npx tsc --noEmit

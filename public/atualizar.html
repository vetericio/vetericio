<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-store">
  <title>Atualizando Oricse</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fcf8f5; color: #4a1826; font-family: Arial, sans-serif; }
    main { width: min(430px, calc(100% - 40px)); padding: 42px 30px; text-align: center; background: #fff; border: 1px solid #ecd9d4; border-radius: 24px; box-shadow: 0 20px 60px rgba(74, 24, 38, .10); }
    .mark { width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%; border: 4px solid #ead5d9; border-top-color: #7d293e; animation: spin 0.8s linear infinite; }
    h1 { margin: 0; font-size: 21px; }
    p { margin: 12px 0 0; color: #765761; line-height: 1.5; font-size: 14px; }
    a { display: inline-block; margin-top: 24px; color: #7d293e; font-weight: 700; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Atualizando a Oricse</h1>
    <p>Estamos buscando a versão mais recente do sistema. Seus dados e seu login não serão apagados.</p>
    <a id="continuar" href="/login">Continuar agora</a>
  </main>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "/";
      const destino = next.startsWith("/") && !next.startsWith("//") ? next : "/";
      try {
        if ("serviceWorker" in navigator) {
          const registros = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registros.map((registro) => registro.unregister()));
        }
        if ("caches" in window) {
          const chaves = await caches.keys();
          await Promise.all(chaves.filter((chave) => chave.startsWith("oricse-")).map((chave) => caches.delete(chave)));
        }
      } catch (_) {}
      // A URL informa que uma tentativa automática já foi feita.
      // Preservar a query e o hash na ordem correta evita rotas quebradas.
      const atualizado = new URL(destino, location.origin);
      atualizado.searchParams.set("oricse_module_retry", "1");
      atualizado.searchParams.set("oricse_build", String(Date.now()));
      const caminho = atualizado.pathname + atualizado.search + atualizado.hash;
      document.getElementById("continuar").href = caminho;
      location.replace(caminho);
    })();
  </script>
</body>
</html>
